  <head>
    <script>
      (function() {
        try {
          var originalFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : null;
          var activeFetch = originalFetch;

          function defineFetchAccessor(target) {
            try {
              Object.defineProperty(target, 'fetch', {
                get: function() {
                  return activeFetch;
                },
                set: function(newFetch) {
                  activeFetch = newFetch;
                },
                configurable: true,
                enumerable: true
              });
              return true;
            } catch (e) {
              return false;
            }
          }

          if (!defineFetchAccessor(window)) {
            var proto = Object.getPrototypeOf(window);
            while (proto) {
              if (defineFetchAccessor(proto)) break;
              proto = Object.getPrototypeOf(proto);
            }
          }
        } catch (err) {}
      })();
    </script>

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ibrahim-portfolio-theme');
          if (saved === 'light' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)) {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.colorScheme = 'light';
          } else {
            document.documentElement.classList.remove('light');
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
